<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0c10;
    color: #e6e8eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  body.light { background: #f6f7fb; color: #1f2328; }
  .bg {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(circle at 10% -10%, rgba(99,102,241,0.25), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(236,72,153,0.18), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(14,165,233,0.18), transparent 40%),
      #0b0c10;
  }
  body.light .bg { background: #f6f7fb; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 28px;
  }
  .brand {
    font-weight: 700; font-size: 14px;
    padding: 10px
